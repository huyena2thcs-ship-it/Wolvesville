<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wolvesville - Shadow vs Vinh Duel</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Montserrat:wght@400;600;700;800;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #0a0608;
      --panel-dark: #140a0e;
      --red-accent: #e6194b;
      --red-dark: #660019;
      --gold-accent: #ffb703;
      --text-light: #f8fafc;
      --text-sub: #94a3b8;
      --card-border: rgba(230, 25, 75, 0.3);
    }

    body {
      background: var(--bg-dark);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    /* MÀN HÌNH MỞ ĐẦU (START GAME) */
    .start-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #2a0810 0%, #050203 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 999; transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .start-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .game-logo {
      font-family: 'Bungee', cursive;
      font-size: 36px;
      color: var(--red-accent);
      text-shadow: 0 0 20px rgba(230, 25, 75, 0.6);
      text-align: center;
      margin-bottom: 20px;
    }

    .btn-start {
      background: linear-gradient(135deg, var(--red-accent), #990026);
      color: #fff; border: none; padding: 14px 38px;
      font-family: 'Bungee', cursive; font-size: 16px;
      border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 25px rgba(230, 25, 75, 0.5);
      transition: transform 0.2s;
    }
    .btn-start:active { transform: scale(0.95); }

    /* CONTAINER CHÍNH CỦA BỐ CỤC UI */
    .main-app {
      width: 100%; max-width: 950px; display: flex; flex-direction: column;
      gap: 25px; padding: 15px; z-index: 5;
    }

    /* SECTION 1: TOP HERO */
    .hero-top {
      position: relative; width: 100%; height: 380px; border-radius: 20px;
      overflow: hidden; background: #1a050b; border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    
    .hero-bg-img {
      position: absolute; right: 0; top: 0; width: 65%; height: 100%;
      object-fit: cover; filter: brightness(0.7) contrast(1.1);
      cursor: pointer;
      mask-image: linear-gradient(to left, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
    }

    .stats-card-left {
      position: absolute; left: 20px; top: 20px; width: 280px;
      background: rgba(45, 10, 20, 0.9); border: 1px solid rgba(230, 25, 75, 0.4);
      border-radius: 16px; padding: 16px; backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 2;
    }

    .card-badge {
      display: inline-block; background: var(--red-accent); color: #fff;
      font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 10px;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
    }

    .stats-row {
      display: flex; justify-content: space-between; font-size: 12px;
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .stats-row:last-child { border-bottom: none; }
    .stats-label { color: var(--text-sub); }
    .stats-value { font-weight: 800; color: var(--gold-accent); }

    .hero-top-title {
      position: absolute; left: 320px; top: 30px; z-index: 2; max-width: 320px;
    }
    .hero-top-title h1 {
      font-family: 'Bungee', cursive; font-size: 26px; color: #fff; line-height: 1.2;
    }
    .hero-top-title p {
      font-size: 12px; color: #cbd5e1; margin-top: 10px; line-height: 1.5;
    }

    /* SECTION 2: MIDDLE SECTION */
    .hero-mid {
      position: relative; width: 100%; min-height: 320px; border-radius: 20px;
      background: linear-gradient(135deg, #1f0810 0%, #0a0204 100%);
      border: 1px solid var(--card-border); overflow: hidden; display: flex;
      align-items: center; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .hero-mid::before {
      content: ''; position: absolute; left: 0; top: 0; width: 50%; height: 100%;
      background-image: radial-gradient(rgba(230, 25, 75, 0.25) 2px, transparent 2px);
      background-size: 14px 14px; opacity: 0.6; pointer-events: none;
    }

    .mid-text { width: 50%; z-index: 2; padding-right: 20px; }
    .mid-text h2 {
      font-family: 'Bungee', cursive; font-size: 22px; color: #fff; margin-bottom: 12px;
    }
    .mid-text p { font-size: 12px; color: var(--text-sub); line-height: 1.6; }

    .mid-img-wrapper {
      width: 50%; height: 280px; border-radius: 16px; overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6); border: 2px solid var(--red-accent);
      cursor: pointer;
    }
    .mid-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    /* SECTION 3: MUSIC PLAYER */
    .hero-bottom-grid {
      display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; width: 100%;
    }

    .music-app-card {
      background: rgba(20, 8, 12, 0.95); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .player-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 15px;
    }
    .player-cover {
      width: 55px; height: 55px; border-radius: 12px; object-fit: cover;
      border: 2px solid var(--gold-accent); cursor: pointer;
    }
    .player-title-box h3 { font-size: 14px; font-weight: 800; color: #fff; }
    .player-title-box p { font-size: 11px; color: var(--text-sub); }

    .progress-bar-container { width: 100%; margin: 10px 0; }
    .seek-slider {
      -webkit-appearance: none;
      width: 100%; height: 6px; border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none; cursor: pointer;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--red-accent); cursor: pointer;
      box-shadow: 0 0 8px rgba(230, 25, 75, 0.8);
    }

    .player-controls { display: flex; justify-content: space-between; align-items: center; }
    .btn-play {
      background: var(--red-accent); color: #fff; border: none; width: 44px; height: 44px;
      border-radius: 50%; font-size: 16px; cursor: pointer; font-family: 'Bungee';
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px 12px rgba(230, 25, 75, 0.5);
    }

    .avatars-box {
      background: rgba(20, 8, 12, 0.95); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .avatars-header {
      font-family: 'Bungee', cursive; font-size: 14px; color: var(--gold-accent);
      margin-bottom: 12px;
    }

    .avatar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .avatar-item {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 4px; text-align: center; transition: transform 0.2s;
      cursor: pointer;
    }
    .avatar-item:hover { transform: translateY(-3px); border-color: var(--red-accent); }
    .avatar-item img { width: 100%; height: 60px; object-fit: cover; border-radius: 6px; display: block; }
    .avatar-item span {
      display: block; font-size: 9px; font-weight: 700; color: #e2e8f0;
      margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* SECTION 4: TƯỜNG GHIM LỜI NHẮN */
    .chat-section {
      width: 100%; background: rgba(20, 8, 12, 0.95); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 20px; box-shadow: 0 10px
